[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envsync"
version = "0.1.0"
description = "Check that .env covers every key in .env.example — with --fix and CI-friendly exit codes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
envsync = "envsync.cli:main"

[tool.setuptools.packages.find]
include = ["envsync*"]
